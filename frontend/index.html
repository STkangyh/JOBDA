<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="JOB:SIM — 생활가전 기업 제품 디자이너 등 실제 직무를 체험해보는 시뮬레이션. 시방서 작성, 관계자 협업, 외주 업체 비교까지 진짜 업무 흐름 그대로 경험하고 직무 이해 리포트를 받아보세요."
    />
    <title>제품디자이너 직무체험</title>
    <script>
      // crypto.randomUUID()는 secure context(https 또는 localhost)에서만 존재함.
      // http+IP 배포(가비아 데모 등)에서는 undefined라 모듈 로드 시점에 즉시 throw되어
      // 흰 화면이 됨(GitHub #3). https/localhost에서는 no-op이라 항상 켜둬도 무해.
      if (!window.crypto.randomUUID) {
        window.crypto.randomUUID = () =>
          'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => {
            const r = (Math.random() * 16) | 0
            return (c === 'x' ? r : (r & 0x3) | 0x8).toString(16)
          })
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
